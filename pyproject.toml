[project]
name = "TarkovTool"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
license = "LGPL-3.0"
license-files = ["License"]

keywords = ["tarkov", "tool"]

classifiers = [
"Development Status :: 3 - Alpha",
"Operating System :: Microsoft :: Windows :: Windows 11",
"Programming Language :: Python :: 3.12",
]

dependencies = [
    "pandas>=3.0.3",
    "platformdirs>=4.9.6",
    "pydantic>=2.13.4",
    "requests>=2.34.2",
]

[project.urls]
Repository = "https://github.com/me/spam.git"

[project.optional-dependencies]
watcher = [
    "watchdog>=6.0.0",
]

[dependency-groups]
dev = [
    "watchdog>=6.0.0",
    "pytest>=9.0.3",
]

[project.scripts]
tarkov-cli = "tarkov_tool:main_cli"

[project.gui-scripts]
tarkov-gui = "tarkov_tool:main_gui"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tarkov_tool"]

[tool.hatch.build.targets.sdist]
exclude = ["reference", "note"]
