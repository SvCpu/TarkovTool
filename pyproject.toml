[project]
name = "TarkovTool"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
license = "LGPL-3.0"
license-files = ["License"]

keywords = ["tarkov", "tool"]

classifiers = [
"Development Status :: 3 - Alpha",
"Operating System :: Microsoft :: Windows :: Windows 11",
"Programming Language :: Python :: 3.12",
]

dependencies = [
    "pandas>=3.0.3",
    "pillow>=12.2.0",
    "platformdirs>=4.9.6",
    "psutil>=7.2.2",
    "pydantic>=2.13.4",
    "python-dotenv>=1.2.2",
    "pywin32>=311;platform_system=='Windows'",
    "requests>=2.34.2",
]

[tool.setuptools.package-data]
"tarkov_tool" = ["tarkov/localization/*.json"]

[project.urls]
Repository = ""

[project.optional-dependencies]
watcher = [
    "watchdog>=6.0.0",
]

[dependency-groups]
dev = [
    "watchdog>=6.0.0",
    "pytest>=9.0.3",
]

[project.scripts]
tarkov-cli = "tarkov_tool:main_cli"

[project.gui-scripts]
tarkov-gui = "tarkov_tool:main_gui"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tarkov_tool", "src/tarkov_tool_util"]

[tool.hatch.build.targets.sdist]
exclude = ["reference", "notes", "assets", "prompts"]

[tool.ruff.lint]
extend-ignore = ["F405", "F403", "E731"]
